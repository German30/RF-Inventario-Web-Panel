# Los tests corren contra H2 con el esquema generado desde las entidades:
# no hace falta un MySQL levantado para compilar ni verificar el contexto.
# Las migraciones de Flyway (db/migration) son SQL de MySQL: se desactivan acá
# a propósito, Hibernate genera el esquema de H2 directo desde las entidades.
spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:rf_inventario;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

rf.cors.allowed-origins=http://localhost:4200

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

rf.panel.jwt.secreto=secreto-de-pruebas-con-mas-de-treinta-y-dos-caracteres
rf.panel.seed.codigo=1001
rf.panel.seed.pin=1234
rf.panel.seed.nombre=Operario Demo

rf.panel.admin-seed.codigo=9001
rf.panel.admin-seed.pin=4321
rf.panel.admin-seed.nombre=Supervisor Demo
