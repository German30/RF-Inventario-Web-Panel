<!--
THESIS: el panel es una herramienta de trabajo, no una vidriera — la
información y la tarea del supervisor tienen que ganar siempre contra
cualquier ornamento; se reemplaza el mundo visual anterior ("hoja de
conteo") por el estándar de SaaS empresarial moderno que el usuario pidió.
OWN-WORLD: superficies neutras (fondo #f6f7f9, tarjetas blancas), un único
acento de acción/foco (índigo #4f46e5), estados semánticos como fondo suave
+ texto de mayor contraste (nunca color plano), tipografía de trabajo Inter
en toda la interfaz, radios y sombras consistentes de bajo contraste.
STORY: un supervisor entra, ve directo la tabla de inventario (sin
bienvenida ni ornamento), y cada alta/edición/ajuste/baja se confirma con
un aviso claro y queda trazado en el historial — sin dudar de si algo se
guardó.
FIRST VIEWPORT: encabezado fijo simple (marca + identidad del operario) más
un nav lateral de íconos y texto, con la tabla de productos a ancho
completo como contenido principal; alta como botón primario sólido en la
esquina superior derecha, buscador con ícono de lupa.
FORM: SaaS empresarial moderno (est. Linear/Notion/Vercel) — ruta canónica,
elegida directamente por el usuario en lugar de un sorteo de direcciones.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, DESIGN.md, and every shipping raster carrying
its provenance.
-->
<app-root></app-root>
</body>
