<div class="modal-backdrop" (click)="cerrar.emit()">
  <div
    class="modal-sheet sheet"
    [class.modal-sheet--angosto]="ancho() === 'angosto'"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
  >
    @if (titulo()) {
      <header class="modal-sheet__header">
        <h2 class="modal-sheet__titulo">{{ titulo() }}</h2>
        <button type="button" class="icon-btn" (click)="cerrar.emit()" aria-label="Cerrar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </header>
    }
    <div class="modal-sheet__body">
      <ng-content />
    </div>
  </div>
</div>
