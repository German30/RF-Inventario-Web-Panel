<div class="toast-stack" role="status" aria-live="polite">
  @for (aviso of toasts.avisos(); track aviso.id) {
    <div class="toast" [class.toast--error]="aviso.tipo === 'error'">
      <span class="toast__icono" aria-hidden="true">
        @if (aviso.tipo === 'error') {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        }
      </span>
      <span class="toast__texto">{{ aviso.texto }}</span>
      <button
        type="button"
        class="icon-btn toast__cerrar"
        (click)="toasts.descartar(aviso.id)"
        aria-label="Cerrar aviso"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
