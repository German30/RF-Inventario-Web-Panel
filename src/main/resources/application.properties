spring.application.name=rf-inventario-panel-api

# 8082: el 8080/8081 los ocupan otros proyectos del portfolio.
server.port=${SERVER_PORT:8082}

# --- MySQL: la MISMA base que escribe la app Android de RF Inventario ---
# Por defecto apunta al MySQL instalado en Windows (3306). Si usas el del
# docker-compose, ajusta DB_PORT.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rf_inventario}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway: dueño del esquema (db/migration/) ---
# baseline-version=1 asume que products/users YA existen tal como quedaron en
# V1__baseline.sql (así era esta base antes de sumar Flyway); en una base
# nueva y vacía Flyway corre V1 igual, desde cero, y termina en el mismo
# estado. A partir de V2 todo cambio de esquema entra por acá, nunca a mano.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway (arriba). Hibernate solo valida que las
# entidades matcheen: `validate` avisa si se desincroniza pero nunca toca tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# --- JSON ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- CORS (panel web) ---
rf.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# --- Swagger / OpenAPI ---
# UI:   http://localhost:8082/swagger-ui.html
# JSON: http://localhost:8082/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.displayRequestDuration=true

# --- Acceso (login por operario) ---
# Clave con la que se firman los tokens. HS256 exige 32+ caracteres.
# En produccion se pasa por variable de entorno y NO se versiona.
rf.panel.jwt.secreto=${JWT_SECRETO:rf-inventario-panel-secreto-de-desarrollo-cambialo-en-produccion}
rf.panel.jwt.duracion-horas=${JWT_HORAS:12}
# Operario sembrado la PRIMERA vez que arranca si la tabla `users` esta vacia.
# Mismo par que usa la app Android. Si ya hay operarios, esto se ignora.
rf.panel.seed.codigo=${SEED_CODIGO:1001}
rf.panel.seed.pin=${SEED_PIN:1234}
rf.panel.seed.nombre=${SEED_NOMBRE:Operario Demo}

# Administrador del panel web sembrado la PRIMERA vez que arranca si la tabla
# `panel_admins` esta vacia (ver V5: el login del panel ya no comparte tabla
# con la app). Si ya hay administradores, esto se ignora.
rf.panel.admin-seed.codigo=${ADMIN_SEED_CODIGO:9001}
rf.panel.admin-seed.pin=${ADMIN_SEED_PIN:4321}
rf.panel.admin-seed.nombre=${ADMIN_SEED_NOMBRE:Supervisor Demo}
