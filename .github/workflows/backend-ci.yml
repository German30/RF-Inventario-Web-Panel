name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y correr tests (H2, sin MySQL)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Publicar el jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rf-inventario-panel-api
          path: target/*.jar
          retention-days: 14
